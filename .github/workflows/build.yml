
name: Build Flow Assist

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: "Geode SDK version (latest, nightly, or v5.11.2)"
        required: false
        default: ""
  push:
    branches:
      - "**"

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source ZIP and locate project
        id: root
        shell: bash
        run: |
          set -e

          if [ ! -f mod.json ]; then
            ZIP=$(find . -maxdepth 2 -name '*_source.zip' -not -path './.git/*' | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "::error::No mod.json or source ZIP found."
              exit 1
            fi

            mkdir -p _flowassist_source
            unzip -oq "$ZIP" -d _flowassist_source

            M=$(find _flowassist_source -type f -name mod.json | head -n 1)

            if [ -z "$M" ]; then
              echo "::error::mod.json not found inside source ZIP."
              exit 1
            fi

            D=$(dirname "$M")

            find "$D" -mindepth 1 -maxdepth 1 \
              ! -name .git ! -name .github \
              -exec cp -a {} . \;
          fi

          test -f mod.json || {
            echo "::error::Project extraction failed."
            exit 1
          }

          echo "dir=." >> "$GITHUB_OUTPUT"

      - name: Run checks and unit tests
        shell: bash
        run: |
          set -e

          if [ -f tools/check_defaults.py ]; then
            python3 tools/check_defaults.py
          fi

          for t in engine_test straight_test; do
            if [ -f "tests/$t.cpp" ]; then
              g++ -std=c++20 -O2 -Wall -Wextra -Werror \
                -I src "tests/$t.cpp" -o "$t"
              "./$t"

              g++ -std=c++20 -O1 -g \
                -fsanitize=address,undefined \
                -fno-sanitize-recover=undefined \
                -I src "tests/$t.cpp" -o "${t}_san"

              "./${t}_san"
            else
              echo "Skipping missing test: $t"
            fi
          done

  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: Android64
            os: ubuntu-latest
            target: Android64

    steps:
      - uses: actions/checkout@v4

      - name: Extract source ZIP and prepare project
        shell: bash
        run: |
          set -e

          if [ ! -f mod.json ]; then
            ZIP=$(find . -maxdepth 2 -name '*_source.zip' -not -path './.git/*' | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "::error::No mod.json or source ZIP found."
              ls -la
              exit 1
            fi

            echo "Extracting $ZIP"

            mkdir -p _flowassist_source
            unzip -oq "$ZIP" -d _flowassist_source

            M=$(find _flowassist_source -type f -name mod.json | head -n 1)

            if [ -z "$M" ]; then
              echo "::error::mod.json not found inside source ZIP."
              exit 1
            fi

            D=$(dirname "$M")

            echo "Project directory: $D"

            find "$D" -mindepth 1 -maxdepth 1 \
              ! -name .git ! -name .github \
              -exec cp -a {} . \;
          fi

          if [ ! -f mod.json ]; then
            echo "::error::Project extraction failed."
            ls -la
            exit 1
          fi

          echo "Project ready:"
          ls -la

      - name: Build Flow Assist
        if: ${{ inputs.sdk == '' }}
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

      - name: Build Flow Assist (chosen SDK)
        if: ${{ inputs.sdk != '' }}
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: ${{ inputs.sdk }}
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Combine Windows and Android builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload final Flow Assist package
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Assist-Build
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
