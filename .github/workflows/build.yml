
name: Flow Assist - Build Android and Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  actions: write

jobs:
  extract:
    name: Extract Flow Assist Source
    runs-on: ubuntu-latest

    outputs:
      project_dir: ${{ steps.extract.outputs.project_dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract source ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="FlowAssist_v1.1.0_source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p extracted-source

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("FlowAssist_v1.1.0_source.zip")
          destination = Path("extracted-source").resolve()

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (destination / item.filename).resolve()
                  if not target.is_relative_to(destination):
                      raise RuntimeError(
                          f"Unsafe ZIP path: {item.filename}"
                      )
              z.extractall(destination)

          print("Source extraction completed.")
          PY

          mapfile -t PROJECTS < <(
            find extracted-source -name CMakeLists.txt -type f |
            while read -r file; do
              dir="$(dirname "$file")"
              if [ -f "$dir/mod.json" ]; then
                echo "$dir"
              fi
            done
          )

          if [ "${#PROJECTS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Geode project with CMakeLists.txt and mod.json."
            exit 1
          fi

          PROJECT_DIR="${PROJECTS[0]}"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Detected project: $PROJECT_DIR"

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: flow-assist-extracted-source
          path: extracted-source/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: extract
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: Win64
            artifact: flow-assist-windows-x64

          - name: Android ARM64
            os: ubuntu-latest
            target: Android64
            artifact: flow-assist-android-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download extracted source
        uses: actions/download-artifact@v4
        with:
          name: flow-assist-extracted-source
          path: extracted-source

      - name: Verify source files
        shell: bash
        env:
          PROJECT_DIR: ${{ needs.extract.outputs.project_dir }}
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/CMakeLists.txt"
          test -f "$PROJECT_DIR/mod.json"

          echo "Source files verified."

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          path: ${{ needs.extract.outputs.project_dir }}
          build-config: Release

      - name: Verify compiled package
        shell: bash
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          set -euo pipefail

          if [ -z "$BUILD_OUTPUT" ] || [ ! -d "$BUILD_OUTPUT" ]; then
            echo "::error::Build output directory missing."
            exit 1
          fi

          PACKAGE="$(find "$BUILD_OUTPUT" -type f -name '*.geode' -print -quit)"

          if [ -z "$PACKAGE" ]; then
            echo "::error::No .geode package was generated."
            exit 1
          fi

          echo "Successfully generated: $PACKAGE"

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.build.outputs.build-output }}/
          if-no-files-found: error
