name: Build Flow Assist

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: "Geode SDK to build with. Leave blank for the default. Examples: latest, nightly, v5.11.2"
        required: false
        default: ""
  push:
    branches:
      - "**"

jobs:
  tests:
    name: Unit tests (skipped if the test files were not uploaded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder
        id: root
        shell: bash
        run: |
          if [ -f mod.json ]; then
            dir=.
          else
            m=$(find . -maxdepth 3 -name mod.json -not -path './.git/*' | head -n 1)
            if [ -z "$m" ]; then
              echo "::error::mod.json was not found anywhere in this repository. Upload the project files (mod.json, CMakeLists.txt, src/, ...)."
              ls -la
              exit 1
            fi
            dir=$(dirname "$m")
          fi
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Run checks and unit tests
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set -e
          if [ -f tools/check_defaults.py ]; then
            python3 tools/check_defaults.py
          else
            echo "::notice::tools/ was not uploaded - skipping the mod.json check"
          fi
          for t in engine_test straight_test; do
            if [ -f "tests/$t.cpp" ]; then
              g++ -std=c++20 -O2 -Wall -Wextra -Werror -I src "tests/$t.cpp" -o "$t"
              "./$t"
              g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -I src "tests/$t.cpp" -o "${t}_san"
              "./${t}_san"
            else
              echo "::notice::tests/$t.cpp was not uploaded - skipping"
            fi
          done

  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android64
            os: ubuntu-latest
            target: Android64
    steps:
      - uses: actions/checkout@v4

      - name: Put the project at the repository root
        shell: bash
        run: |
          if [ ! -f mod.json ]; then
            m=$(find . -maxdepth 3 -name mod.json -not -path './.git/*' | head -n 1)
            if [ -z "$m" ]; then
              echo "::error::mod.json was not found anywhere in this repository. Upload the project files (mod.json, CMakeLists.txt, src/, ...)."
              ls -la
              exit 1
            fi
            d=$(dirname "$m")
            echo "mod.json is in $d, not at the repository root - copying the project up to the root"
            cp -a "$d"/. .
          fi
          echo "Repository root:"
          ls -la

      - name: Build the mod
        if: ${{ inputs.sdk == '' }}
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

      - name: Build the mod (chosen SDK)
        if: ${{ inputs.sdk != '' }}
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: ${{ inputs.sdk }}
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    if: ${{ !cancelled() }}
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
