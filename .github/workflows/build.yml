
name: Build Flow Assist

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  extract-source:
    name: Extract Source ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flow Assist source ZIP if present
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "FlowAssist_v*_source.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found source archive: $ZIP_FILE"
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            if [ -d extracted/FlowAssist ]; then
              cp -a extracted/FlowAssist/. .
            else
              cp -a extracted/. .
            fi
          else
            echo "No source ZIP found. Using repository files."
          fi

      - name: Verify source files
        run: |
          test -f mod.json
          test -f CMakeLists.txt
          test -d src
          echo "Source extraction verified."

  engine-tests:
    name: Engine unit tests
    runs-on: ubuntu-latest
    needs: extract-source
    steps:
      - uses: actions/checkout@v4

      - name: Run source tests
        run: |
          python3 tools/check_defaults.py
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I src tests/engine_test.cpp -o engine_test
          ./engine_test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I src tests/straight_test.cpp -o straight_test
          ./straight_test

  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android ARM64
            os: ubuntu-latest
            target: Android64
            artifact: flow-assist-android-arm64
          - name: Windows x64
            os: windows-latest
            target: Win64
            artifact: flow-assist-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Build Flow Assist
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}
          path: build/*.geode
          if-no-files-found: error
