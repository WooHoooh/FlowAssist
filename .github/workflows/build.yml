name: Build Flow Assist

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  engine-tests:
    name: Engine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check mod.json against the code
        run: python3 tools/check_defaults.py
      - name: Build and run engine tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I src tests/engine_test.cpp -o engine_test
          ./engine_test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I src tests/straight_test.cpp -o straight_test
          ./straight_test
      - name: Engine tests under AddressSanitizer and UBSan
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -I src tests/engine_test.cpp -o engine_test_san
          ./engine_test_san
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -I src tests/straight_test.cpp -o straight_test_san
          ./straight_test_san
      - name: Old-vs-new engine measurements (informational)
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -I src -I tests tests/compare_test.cpp -o compare_test
          ./compare_test

  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android ARM64
            os: ubuntu-latest
            target: Android64
            artifact: flow-assist-android-arm64
          - name: Windows x64
            os: windows-latest
            artifact: flow-assist-windows-x64
    steps:
      - uses: actions/checkout@v4
      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
